name: source-update

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install pinned validation dependencies
        run: python3 -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Refresh pinned machine-readable sources
        run: |
          python3 -B scripts/build_indexes.py --fetch
          python3 -B scripts/update_sources.py --write-lock --check
          python3 -B scripts/validate_sources.py
          python3 -B scripts/validate_repo.py
          python3 -B scripts/run_eval.py --output ai/evaluation-report.json
          python3 -B scripts/validate_schemas.py
          python3 -B scripts/validate_rules.py
          python3 -B scripts/validate_threat_models.py
          python3 -B scripts/build_release_manifest.py
      - name: Open update pull request
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          commit-message: "Refresh machine-readable security sources"
          title: "Refresh machine-readable security sources"
          body: "Automated pinned CWE/CAPEC refresh with generated hashes and coverage report."
          branch: automation/source-refresh

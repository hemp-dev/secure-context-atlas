rules:
  - id: rule.semgrep.ai.tool-arguments
    languages: [python]
    message: "Model-produced tool arguments reach a capability boundary. Confirm authorization and typed argument validation."
    severity: WARNING
    patterns:
      - pattern-either:
          - pattern: $TOOL.invoke($ARGS, ...)
          - pattern: $TOOL.call($ARGS, ...)
    metadata:
      atlas_rule_id: rule.semgrep.ai.tool-arguments
      vulnerability_id: vuln.ai.tool-authorization
      confidence: medium
      source_signal: model.tool_call.arguments
      sink_signal: tool_or_mcp.invoke
      required_control: capability-policy-before-side-effect

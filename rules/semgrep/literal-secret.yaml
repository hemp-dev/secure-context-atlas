rules:
  - id: rule.semgrep.secrets.literal
    languages: [python]
    message: "A secret-like literal appears in source or configuration. Confirm whether it is real, reachable and rotated."
    severity: WARNING
    patterns:
      - pattern: $KEY = "$VALUE"
      - metavariable-regex:
          metavariable: $KEY
          regex: "(?i)^(password|passwd|secret|token|api_key|apikey)$"
      - metavariable-regex:
          metavariable: $VALUE
          regex: "^.{8,}$"
    metadata:
      atlas_rule_id: rule.semgrep.secrets.literal
      vulnerability_id: vuln.secrets.hardcoded
      confidence: medium
      source_signal: source_literal
      sink_signal: authentication_or_provider_client
      required_control: managed-secret-or-short-lived-identity

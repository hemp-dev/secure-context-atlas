rules:
  - id: rule.semgrep.network.ssrf-url-fetch
    languages: [python]
    message: "A server-side HTTP client receives a URL. Confirm destination policy and redirect revalidation."
    severity: WARNING
    pattern: requests.$METHOD($URL, ...)
    metadata:
      atlas_rule_id: rule.semgrep.network.ssrf-url-fetch
      vulnerability_id: vuln.network.ssrf
      confidence: low
      source_signal: request.url
      sink_signal: server_http_client
      required_control: destination-policy-and-revalidation

rules:
  - id: rule.semgrep.injection.nosql-operator
    languages: [python]
    message: "Structured request data reaches a document query. Confirm schema validation and an operator allowlist."
    severity: WARNING
    pattern: $COLLECTION.find($FILTER, ...)
    metadata:
      atlas_rule_id: rule.semgrep.injection.nosql-operator
      vulnerability_id: vuln.injection.nosql
      confidence: low
      source_signal: request.body.filter
      sink_signal: document_collection.find
      required_control: schema-and-operator-allowlist

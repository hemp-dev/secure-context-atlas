rules:
  - id: rule.semgrep.injection.process-shell
    languages: [python]
    message: "Process execution enables a shell. Confirm fixed executable, typed arguments and worker isolation."
    severity: ERROR
    pattern: subprocess.$FUNC(..., shell=True, ...)
    metadata:
      atlas_rule_id: rule.semgrep.injection.process-shell
      vulnerability_id: vuln.injection.command
      confidence: high
      source_signal: request.value
      sink_signal: process.execute
      required_control: argument-vector-and-capability-boundary

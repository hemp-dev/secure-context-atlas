rules:
  - id: rule.semgrep.files.path-resolution
    languages: [python]
    message: "A request-derived path reaches filesystem access. Confirm canonical containment after resolution."
    severity: WARNING
    pattern-either:
      - pattern: open($PATH, ...)
      - pattern: pathlib.Path($PATH).read_text(...)
      - pattern: pathlib.Path($PATH).write_text(...)
    metadata:
      atlas_rule_id: rule.semgrep.files.path-resolution
      vulnerability_id: vuln.files.path-traversal
      confidence: low
      source_signal: request.path
      sink_signal: filesystem.read_or_write
      required_control: resolved-path-containment
